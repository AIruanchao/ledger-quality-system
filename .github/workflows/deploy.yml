name: 部署 (CD)

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      target:
        description: '部署目标'
        required: true
        default: 'staging'
        type: choice
        options: ['staging', 'production']

jobs:
  # === staging自动部署 ===
  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    needs: []
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install pydantic httpx pytest pytest-cov ruff
      - name: Pre-deploy gate
        run: |
          ruff check src/ tests/
          pytest tests/unit/ -q --cov=src --cov-fail-under=80
          echo "✅ Pre-deploy gate passed"
      - name: Deploy notification
        run: |
          echo "📦 Staging deployment triggered for ${{ github.sha }}"
          echo "In production, this would scp to staging server and restart service"

  # === production需要tag+手动审批 ===
  deploy-production:
    name: Deploy to Production (requires tag)
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    environment:
      name: production
      url: https://erp.nenie.vip
    needs: []
    steps:
      - uses: actions/checkout@v4
      - name: Production deploy
        run: |
          echo "🚀 Production deployment for tag ${{ github.ref_name }}"
          echo "Version: ${{ github.ref_name }}"
          echo "Commit: ${{ github.sha }}"

  # === 回滚 ===
  rollback:
    name: Rollback
    runs-on: ubuntu-latest
    if: github.event.inputs.target == 'rollback'
    workflow_dispatch:
    steps:
      - uses: actions/checkout@v4
      - name: Find previous tag
        run: |
          echo "⏪ Rollback procedure"
          git tag --sort=-version:refname | head -5
          echo "Specify target version tag to rollback to"
