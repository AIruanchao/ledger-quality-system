[project]
name = "ledger-quality-system"
version = "1.0.0"
description = "台账系统质量保障标准化工程"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0",
    "httpx>=0.27",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.5",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short --strict-markers"
markers = [
    "unit: 纯逻辑单元测试（无外部依赖）",
    "integration: API集成测试（需网络）",
    "e2e: 端到端测试（需飞书/HT/ERP）",
    "slow: 耗时测试（>10s）",
]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "S", "T20"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S105", "S310", "S603", "S607", "T20", "F841", "B007"]
"scripts/*" = ["T20", "S603", "S607"]
"src/config.py" = ["T201"]
"src/feishu_client.py" = ["S310"]
"src/monitors/__init__.py" = ["S310", "S603", "S607"]
"src/monitors/alert.py" = ["S310", "T201"]
"src/tz_cli.py" = ["S310", "B007"]
"src/sentry.py" = ["T201"]
"src/api.py" = ["I001"]
"src/validators/schema.py" = ["UP042", "UP045", "UP037"]

[tool.coverage.run]
source = ["src"]
omit = ["tests/*", "scripts/*", "src/tz_cli.py", "src/monitors/*", "src/api.py"]

[tool.coverage.report]
fail_under = 80
show_missing = true
